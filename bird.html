    </div>

      </div>

    <script>
      let ids = [];
      for(let i = 0; i<35; i++){
        ids.push("bush" + i);
      }

      let score = 0;
      let gameOver = false;
      let locationsVisited = 0;
      let lastLocation = 0;

      let statueLocation = 19;
      let toucanLocation = 14;
      let lorikeetLocations = [3,25];
      let buntingLocations = [2,5,11,20,21];
      let locationsTV = document.getElementById("locations");


      function check(position){
        if(gameOver){
          return;
        }

        let id = ids[position];
        const img = document.getElementById(id);
        let scoreBoard = document.getElementById("score");

        if(buntingLocations.includes(position) ){
          img.src = "bunting.png";
          img.onclick = null;
          score += 1;
          scoreBoard.innerHTML = "Score is " + score;
        }
        else if(lorikeetLocations.includes(position)){
          img.src = "lorikeet.png";
          img.onclick = null;
          score += 3;
          scoreBoard.innerHTML = "Score is " + score;
        }
        else if(position === statueLocation){
          img.src = "golden.png"
          img.onclick = null;
          score -= 3;
          gameOver = true;
          scoreBoard.innerHTML = "Final score is " + score;
        }
        else if(position === toucanLocation){
          img.src = "toucan.png"
          img.onclick = null;
          score += 5;
          scoreBoard.innerHTML = "Score is " + score;
          
        }
        else{
          img.src = "bush.png";
          img.onclick = null;
        }

        locationsVisited ++;
        locationsTV.innerHTML = "Number of locations checked: " + locationsVisited;
        lastLocation = position;
      }

    function help(lastLocation){
      let helpBunting = [(lastLocation - 7 + 35) % 35, (lastLocation - 1 + 35) % 35, (lastLocation + 7) % 35, (lastLocation + 1) % 35]
      for(let i = 0; i < helpBunting.length; i++){
        if(buntingLocations.includes(helpBunting[i])){
          return "cheep";
        }
      }
      
      let row = Math.floor(lastLocation / 7);
      let col = lastLocation % 7;
      for(let r = row - 1; r <= row + 1; r++){
        for(let c = col -1; c <= col + 1; c++){
          if (r >= 0 && r < 5 && c >= 0 && c < 7){
            let pos = r * 7 + c;
            if(toucanLocation === pos){
              return "caw"
            }
            if(statueLocation === pos){
              return "thrrum"
            }
          }
        }
      }

      return "silence"
    }
  
    </script>
  </body>
</html>
